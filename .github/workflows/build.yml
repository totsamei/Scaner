name: Build Offline Price Scanner APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/pricescanner

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PriceScanner"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.pricescanner"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.pricescanner"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 10
                  versionName = "2.8"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("com.google.mlkit:text-recognition:16.0.0")

              val cameraxVersion = "1.3.1"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera.any" />

              <application
                  android:allowBackup="true"
                  android:label="Сканер цен"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="ocr" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/pricescanner/MainActivity.kt
          package com.example.pricescanner

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.text.InputType
          import android.util.Size
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.annotation.OptIn
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.abs

          data class CartItem(var name: String, var price: Double, var count: Int = 1)
          data class PriceBox(val value: Double, val rect: Rect, val area: Int)

          class ScannerOverlayView(context: Context) : View(context) {
              private val paintDim = Paint().apply { color = Color.parseColor("#99000000") } // Затемнение 60%
              private val paintClear = Paint().apply { 
                  xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
                  isAntiAlias = true 
              }
              private val paintStroke = Paint().apply { 
                  color = Color.parseColor("#00E676")
                  style = Paint.Style.STROKE
                  strokeWidth = 10f
                  isAntiAlias = true 
              }
              init { setLayerType(LAYER_TYPE_HARDWARE, null) }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paintDim)
                  val cw = width * 0.70f  // 70% ширины экрана
                  val ch = height * 0.25f // 25% высоты экрана (более квадратная рамка)
                  val cx = width / 2f
                  val cy = height / 2f
                  val rect = RectF(cx - cw/2, cy - ch/2, cx + cw/2, cy + ch/2)
                  canvas.drawRoundRect(rect, 32f, 32f, paintClear)
                  canvas.drawRoundRect(rect, 32f, 32f, paintStroke)
              }
          }

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var tvDetectedPrice: TextView
              private lateinit var tvTotalSum: TextView
              private lateinit var itemsContainer: LinearLayout
              private lateinit var chipsContainer: LinearLayout
              private lateinit var rootLayout: LinearLayout
              private lateinit var sumPanel: LinearLayout
              private lateinit var cameraExecutor: ExecutorService

              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private val cartItems = mutableListOf<CartItem>()

              // Стабилизатор: требуем 3 одинаковых результата из 4 последних
              private val recentDetections = ArrayDeque<Double>()
              private var lockedPrice: Double? = null
              private var isPaused = false
              private var lastAnalyzeTime = 0L
              private var emptyFrames = 0

              private var currentTheme = "Dark"
              private var roundPrices = false
              private var vibeEnabled = true
              private var vibeMs = 45L

              private val pickImageLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let { processImageFromUri(it) }
              }

              private val requestPermissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { isGranted ->
                  if (isGranted) startCamera() else Toast.makeText(this, "Нужен доступ к камере", Toast.LENGTH_LONG).show()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  cameraExecutor = Executors.newSingleThreadExecutor()
                  loadSettings()
                  loadSavedCart()
                  setupUI()
                  applyThemeColors()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  } else {
                      requestPermissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              private fun setupUI() {
                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(24, 16, 24, 16)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titleTv = TextView(this).apply {
                      text = "Сканер цен"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val btnSettings = Button(this).apply {
                      text = "⚙ Настройки"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(20, 10, 20, 10)
                      background = makeRoundedButtonDrawable(Color.parseColor("#424242"), 20f)
                      setTextColor(Color.WHITE)
                      setOnClickListener { showSettingsDialog() }
                  }
                  topBar.addView(titleTv)
                  topBar.addView(btnSettings)
                  rootLayout.addView(topBar)

                  val cameraFrame = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f)
                  }
                  previewView = PreviewView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  }
                  cameraFrame.addView(previewView)

                  val overlay = ScannerOverlayView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  }
                  cameraFrame.addView(overlay)

                  tvDetectedPrice = TextView(this).apply {
                      text = "Наведи на цену..."
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(40, 18, 40, 18)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#D9000000"))
                          cornerRadius = 32f
                      }
                      layoutParams = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      ).apply { bottomMargin = 24 }
                  }
                  cameraFrame.addView(tvDetectedPrice)
                  rootLayout.addView(cameraFrame)

                  chipsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(20, 8, 20, 8)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  rootLayout.addView(chipsContainer)

                  val controlsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(16, 12, 16, 12)
                      gravity = Gravity.CENTER
                  }

                  val btnAddLive = Button(this).apply {
                      text = "+ ДОБАВИТЬ"
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#00C853"), 24f)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 140, 1.4f).apply { marginEnd = 12 }
                      setOnClickListener {
                          if (lockedPrice != null) {
                              vibrate()
                              addPriceToCart("Товар", lockedPrice!!)
                          } else {
                              Toast.makeText(this@MainActivity, "Сначала наведите на цену", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  val btnFreeze = Button(this).apply {
                      text = "❄ СТОП"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#00838F"), 24f)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 140, 1.0f).apply { marginEnd = 12 }
                      setOnClickListener {
                          isPaused = !isPaused
                          text = if (isPaused) "▶ ПУСК" else "❄ СТОП"
                          background = makeRoundedButtonDrawable(Color.parseColor(if (isPaused) "#EF6C00" else "#00838F"), 24f)
                      }
                  }

                  val btnManual = Button(this).apply {
                      text = "ВРУЧНУЮ"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#424242"), 24f)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 140, 1.0f)
                      setOnClickListener { showManualInputDialog() }
                  }

                  controlsLayout.addView(btnAddLive)
                  controlsLayout.addView(btnFreeze)
                  controlsLayout.addView(btnManual)
                  rootLayout.addView(controlsLayout)

                  sumPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(28, 20, 28, 20)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  tvTotalSum = TextView(this).apply {
                      text = "Итого: 0.00 ₽"
                      setTextColor(Color.parseColor("#00E676"))
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val btnClearAll = Button(this).apply {
                      text = "СБРОС"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#D32F2F"), 20f)
                      setTextColor(Color.WHITE)
                      setOnClickListener { showClearCartDialog() }
                  }

                  sumPanel.addView(tvTotalSum)
                  sumPanel.addView(btnClearAll)
                  rootLayout.addView(sumPanel)

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 0.9f)
                  }
                  itemsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 12, 20, 24)
                  }
                  scrollView.addView(itemsContainer)
                  rootLayout.addView(scrollView)

                  setContentView(rootLayout)
                  refreshCartUI()
              }

              private fun showClearCartDialog() {
                  AlertDialog.Builder(this)
                      .setTitle("Очистить список?")
                      .setMessage("Вы уверены, что хотите удалить все товары?")
                      .setPositiveButton("Да, удалить") { _, _ ->
                          cartItems.clear()
                          saveCart()
                          refreshCartUI()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun makeRoundedButtonDrawable(color: Int, radiusDp: Float): GradientDrawable {
                  val density = resources.displayMetrics.density
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = radiusDp * density
                  }
              }

              private fun applyThemeColors() {
                  val bg: Int; val panelBg: Int
                  when (currentTheme) {
                      "Light" -> {
                          bg = Color.parseColor("#F5F5F5")
                          panelBg = Color.parseColor("#FFFFFF")
                      }
                      "Amoled" -> {
                          bg = Color.parseColor("#000000")
                          panelBg = Color.parseColor("#0A0A0A")
                      }
                      else -> {
                          bg = Color.parseColor("#121212")
                          panelBg = Color.parseColor("#1E1E1E")
                      }
                  }
                  rootLayout.setBackgroundColor(bg)
                  sumPanel.setBackgroundColor(panelBg)
              }

              @OptIn(ExperimentalGetImage::class)
              private fun startCamera() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      val cameraProvider = cameraProviderFuture.get()
                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }

                      val imageAnalyzer = ImageAnalysis.Builder()
                          .setTargetResolution(Size(720, 1280))
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()

                      imageAnalyzer.setAnalyzer(cameraExecutor) { imageProxy ->
                          if (isPaused) {
                              imageProxy.close()
                              return@setAnalyzer
                          }
                          val now = System.currentTimeMillis()
                          // Частота анализа: раз в 500 мс (стабильность)
                          if (now - lastAnalyzeTime < 500) {
                              imageProxy.close()
                              return@setAnalyzer
                          }
                          lastAnalyzeTime = now

                          val mediaImage = imageProxy.image
                          if (mediaImage != null) {
                              val bitmap = imageProxy.toBitmap()
                              
                              // ФИЗИЧЕСКАЯ ОБРЕЗКА: мы отдаем нейросети только то, что внутри зеленой рамки!
                              // Размеры рамки: ширина 70%, высота 25% по центру
                              val cropX = (bitmap.width * 0.15f).toInt()
                              val cropY = (bitmap.height * 0.375f).toInt()
                              val cropW = (bitmap.width * 0.70f).toInt()
                              val cropH = (bitmap.height * 0.25f).toInt()
                              
                              val croppedBitmap = Bitmap.createBitmap(bitmap, cropX, cropY, cropW, cropH)
                              val image = InputImage.fromBitmap(croppedBitmap, 0)
                              
                              recognizer.process(image)
                                  .addOnSuccessListener { visionText ->
                                      val bestPrice = analyzeCroppedImage(visionText)
                                      runOnUiThread { updateStabilizedPrice(bestPrice) }
                                  }
                                  .addOnCompleteListener { imageProxy.close() }
                          } else {
                              imageProxy.close()
                          }
                      }

                      cameraProvider.unbindAll()
                      cameraProvider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, imageAnalyzer)
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun updateStabilizedPrice(newPrice: Double?) {
                  if (newPrice != null) {
                      emptyFrames = 0
                      recentDetections.addLast(newPrice)
                      if (recentDetections.size > 4) recentDetections.removeFirst()

                      // Требуем 3 одинаковых результата из 4 последних
                      val stablePrice = recentDetections.groupingBy { it }.eachCount().entries.firstOrNull { it.value >= 3 }?.key

                      if (stablePrice != null) {
                          lockedPrice = if (roundPrices) stablePrice.toInt().toDouble() else stablePrice
                          tvDetectedPrice.text = String.format("Цена: %.2f ₽", lockedPrice)
                      }
                  } else {
                      emptyFrames++
                      if (emptyFrames >= 3) { // Если 3 кадра подряд пусто - сбрасываем залипание
                          recentDetections.clear()
                          lockedPrice = null
                          tvDetectedPrice.text = "Наведи на цену..."
                          chipsContainer.removeAllViews()
                      }
                  }
              }

              private fun analyzeCroppedImage(visionText: Text): Double? {
                  val allNumbers = mutableListOf<PriceBox>()

                  for (block in visionText.
