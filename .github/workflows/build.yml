name: Build Offline Price Scanner APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/pricescanner

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PriceScanner"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.pricescanner"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.pricescanner"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 12
                  versionName = "3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("com.google.mlkit:text-recognition:16.0.0")

              val cameraxVersion = "1.3.1"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera.any" />

              <application
                  android:allowBackup="true"
                  android:label="Сканер цен"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="ocr" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/pricescanner/MainActivity.kt
          package com.example.pricescanner

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.text.InputType
          import android.util.Size
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.annotation.OptIn
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.abs

          data class CartItem(var name: String, var price: Double, var count: Int = 1)
          data class PriceBox(val value: Double, val rect: Rect, val area: Int)

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var tvDetectedPrice: TextView
              private lateinit var tvTotalSum: TextView
              private lateinit var itemsContainer: LinearLayout
              private lateinit var chipsContainer: LinearLayout
              private lateinit var rootLayout: LinearLayout
              private lateinit var bottomPanel: LinearLayout
              private lateinit var sumPanel: LinearLayout
              private lateinit var cameraExecutor: ExecutorService

              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private val cartItems = mutableListOf<CartItem>()

              private val recentDetections = ArrayDeque<Double>()
              private var lockedPrice: Double? = null
              private var isPaused = false
              private var lastAnalyzeTime = 0L
              private var emptyFrames = 0

              private var currentTheme = "Dark"
              private var roundPrices = false
              private var vibeEnabled = true
              private var vibeMs = 45L

              private val pickImageLauncher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let { processImageFromUri(it) }
              }

              private val requestPermissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { isGranted ->
                  if (isGranted) startCamera() else Toast.makeText(this, "Нужен доступ к камере", Toast.LENGTH_LONG).show()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  cameraExecutor = Executors.newSingleThreadExecutor()
                  loadSettings()
                  loadSavedCart()
                  setupUI()
                  applyThemeColors()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  } else {
                      requestPermissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              private fun setupUI() {
                  rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  // 1. Камера занимает ровно 35% экрана сверху
                  val cameraFrame = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 0.35f)
                  }
                  previewView = PreviewView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  }
                  cameraFrame.addView(previewView)
                  
                  // Разделительная полоска
                  val border = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, 6).apply {
                          gravity = Gravity.BOTTOM
                      }
                      setBackgroundColor(Color.parseColor("#00E676"))
                  }
                  cameraFrame.addView(border)
                  rootLayout.addView(cameraFrame)

                  // 2. Нижняя панель с глухим фоном занимает 65%
                  bottomPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 0.65f)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(24, 16, 24, 16)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titleTv = TextView(this).apply {
                      text = "Сканер цен"
                      textSize = 18f
                      setTextColor(Color.GRAY)
                      setTypeface(null, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val btnSettings = Button(this).apply {
                      text = "⚙ Настройки"
                      textSize = 14f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(16, 8, 16, 8)
                      background = makeRoundedButtonDrawable(Color.parseColor("#333333"), 16f)
                      setTextColor(Color.WHITE)
                      setOnClickListener { showSettingsDialog() }
                  }
                  topBar.addView(titleTv)
                  topBar.addView(btnSettings)
                  bottomPanel.addView(topBar)

                  tvDetectedPrice = TextView(this).apply {
                      text = "Наведите камеру..."
                      setTextColor(Color.parseColor("#00E676"))
                      textSize = 28f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 10, 0, 20)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }
                  bottomPanel.addView(tvDetectedPrice)

                  chipsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(20, 0, 20, 16)
                      gravity = Gravity.CENTER
                  }
                  bottomPanel.addView(chipsContainer)

                  val controlsLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(16, 0, 16, 16)
                      gravity = Gravity.CENTER
                  }

                  val btnAddLive = Button(this).apply {
                      text = "+ ДОБАВИТЬ"
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#00C853"), 24f)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 140, 1.4f).apply { marginEnd = 12 }
                      setOnClickListener {
                          if (lockedPrice != null) {
                              vibrate()
                              addPriceToCart("Товар", lockedPrice!!)
                          } else {
                              Toast.makeText(this@MainActivity, "Цена не определена", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  val btnFreeze = Button(this).apply {
                      text = "❄ СТОП"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#00838F"), 24f)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 140, 1.0f).apply { marginEnd = 12 }
                      setOnClickListener {
                          isPaused = !isPaused
                          text = if (isPaused) "▶ ПУСК" else "❄ СТОП"
                          background = makeRoundedButtonDrawable(Color.parseColor(if (isPaused) "#EF6C00" else "#00838F"), 24f)
                      }
                  }

                  val btnManual = Button(this).apply {
                      text = "ВРУЧНУЮ"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#424242"), 24f)
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 140, 1.0f)
                      setOnClickListener { showManualInputDialog() }
                  }

                  controlsLayout.addView(btnAddLive)
                  controlsLayout.addView(btnFreeze)
                  controlsLayout.addView(btnManual)
                  bottomPanel.addView(controlsLayout)

                  sumPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(28, 20, 28, 20)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  tvTotalSum = TextView(this).apply {
                      text = "Итого: 0.00 ₽"
                      setTextColor(Color.parseColor("#00E676"))
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val btnClearAll = Button(this).apply {
                      text = "СБРОС"
                      textSize = 15f
                      setTypeface(null, Typeface.BOLD)
                      background = makeRoundedButtonDrawable(Color.parseColor("#D32F2F"), 20f)
                      setTextColor(Color.WHITE)
                      setOnClickListener { showClearCartDialog() }
                  }

                  sumPanel.addView(tvTotalSum)
                  sumPanel.addView(btnClearAll)
                  bottomPanel.addView(sumPanel)

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }
                  itemsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 12, 20, 24)
                  }
                  scrollView.addView(itemsContainer)
                  bottomPanel.addView(scrollView)

                  rootLayout.addView(bottomPanel)
                  setContentView(rootLayout)
              }

              private fun showClearCartDialog() {
                  AlertDialog.Builder(this)
                      .setTitle("Очистить список?")
                      .setMessage("Вы уверены, что хотите удалить все товары?")
                      .setPositiveButton("Да, удалить") { _, _ ->
                          cartItems.clear()
                          saveCart()
                          refreshCartUI()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun makeRoundedButtonDrawable(color: Int, radiusDp: Float): GradientDrawable {
                  val density = resources.displayMetrics.density
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = radiusDp * density
                  }
              }

              private fun applyThemeColors() {
                  val bg: Int; val panelBg: Int
                  when (currentTheme) {
                      "Light" -> {
                          bg = Color.parseColor("#FFFFFF")
                          panelBg = Color.parseColor("#F5F5F5")
                      }
                      "Amoled" -> {
                          bg = Color.parseColor("#000000")
                          panelBg = Color.parseColor("#0A0A0A")
                      }
                      else -> {
                          bg = Color.parseColor("#121212")
                          panelBg = Color.parseColor("#1E1E1E")
                      }
                  }
                  bottomPanel.setBackgroundColor(bg)
                  sumPanel.setBackgroundColor(panelBg)
              }

              @OptIn(ExperimentalGetImage::class)
              private fun startCamera() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      val cameraProvider = cameraProviderFuture.get()
                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }

                      val imageAnalyzer = ImageAnalysis.Builder()
                          .setTargetResolution(Size(720, 1280))
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()

                      imageAnalyzer.setAnalyzer(cameraExecutor) { imageProxy ->
                          if (isPaused) {
                              imageProxy.close()
                              return@setAnalyzer
                          }
                          val now = System.currentTimeMillis()
                          if (now - lastAnalyzeTime < 500) {
                              imageProxy.close()
                              return@setAnalyzer
                          }
                          lastAnalyzeTime = now

                          val mediaImage = imageProxy.image
                          if (mediaImage != null) {
                              val bitmap = imageProxy.toBitmap()
                              
                              // МАТЕМАТИКА ИДЕАЛЬНОЙ ОБРЕЗКИ (Синхронизировано с экраном)
                              val viewRatio = previewView.width.toFloat() / previewView.height.toFloat()
                              val bitmapRatio = bitmap.width.toFloat() / bitmap.height.toFloat()
                              
                              var cropX = 0
                              var cropY = 0
                              var cropW = bitmap.width
                              var cropH = bitmap.height
                              
                              if (viewRatio > bitmapRatio) {
                                  cropH = (bitmap.width / viewRatio).toInt()
                                  cropY = (bitmap.height - cropH) / 2
                              } else {
                                  cropW = (bitmap.height * viewRatio).toInt()
                                  cropX = (bitmap.width - cropW) / 2
                              }
                              
                              val croppedBitmap = Bitmap.createBitmap(bitmap, cropX, cropY, cropW, cropH)
                              val image = InputImage.fromBitmap(croppedBitmap, 0)
                              
                              recognizer.process(image)
                                  .addOnSuccessListener { visionText ->
                                      val (bestPrice, alternatives) = analyzeCroppedImage(visionText)
                                      runOnUiThread { updateStabilizedPrice(bestPrice, alternatives) }
                                  }
                                  .addOnCompleteListener { imageProxy.close() }
                          } else {
                              imageProxy.close()
                          }
                      }

                      cameraProvider.unbindAll()
                      cameraProvider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, imageAnalyzer)
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun updateStabilizedPrice(newPrice: Double?, alternatives: List<Double>) {
                  if (newPrice != null) {
                      emptyFrames = 0
                      recentDetections.addLast(newPrice)
                      if (recentDetections.size > 4) recentDetections.removeFirst()

                      val stablePrice = recentDetections.groupingBy { it }.eachCount().entries.firstOrNull { it.value >= 3 }?.key

                      if (stablePrice != null) {
                          lockedPrice = if (roundPrices) stablePrice.toInt().toDouble() else stablePrice
                          tvDetectedPrice.text = String.format("%.2f ₽", lockedPrice)
                          tvDetectedPrice.setTextColor(Color.WHITE)
                      }
                  } else {
                      emptyFrames++
                      if (emptyFrames >= 2) {
                          recentDetections.clear()
                          lockedPrice = null
                          tvDetectedPrice.text = "Наведите камеру..."
                          tvDetectedPrice.setTextColor(Color.parseColor("#00E676"))
                          chipsContainer.removeAllViews()
                      }
                  }

                  if (alternatives.isNotEmpty() && lockedPrice != null) {
                      chipsContainer.removeAllViews()
                      val label = TextView(this).apply {
                          text = "Или: "
                          setTextColor(Color.LTGRAY)
                          textSize = 14f
                      }
                      chipsContainer.addView(label)

                      alternatives.take(3).forEach { altPrice ->
                          val finalAltPrice = if (roundPrices) altPrice.toInt().toDouble() else altPrice
                          val chip = Button(this).apply {
                              text = String.format("%.0f ₽", finalAltPrice)
                              textSize = 13f
                              setTypeface(null, Typeface.BOLD)
                              setPadding(16, 2, 16, 2)
                              background = makeRoundedButtonDrawable(Color.parseColor("#2E7D32"), 16f)
                              setTextColor(Color.WHITE)
                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.WRAP_CONTENT,
                                  96
                              ).apply { marginStart = 8 }
                              setOnClickListener {
                                  vibrate()
                                  addPriceToCart("Товар", finalAltPrice)
                              }
                          }
                          chipsContainer.addView(chip)
                      }
                  }
              }

              private fun analyzeCroppedImage(visionText: Text): Pair<Double?, List<Double>> {
                  val allNumbers = mutableListOf<PriceBox>()

                  for (block in visionText.textBlocks) {
                      for (line in block.lines) {
                          val rect = line.boundingBox ?: continue
                          
                          // Убираем все пробелы и апострофы перед поиском (решает проблему 1'234 и 1 234)
                          val cleanLineText = line.text
                              .replace("O", "0").replace("О", "0")
                              .replace("З", "3").replace("Б", "6")
                              .replace("'", "").replace(" ", "").replace(",", ".")

                          val regex = Regex("""\d{1,5}([.]\d{2})?""")
                          val matches = regex.findAll(cleanLineText)

                          for (match in matches) {
                              val num = match.value.toDoubleOrNull() ?: continue
                              val area = rect.width() * rect.height()
                              allNumbers.add(PriceBox(num, rect, area))
                          }
                      }
                  }

                  // ЖЕСТКИЙ ЛИМИТ: Игнорируем всё, что меньше 15 и больше 15000
                  val validCandidates = allNumbers.filter { it.value in 15.0..15000.0 }
                  if (validCandidates.isEmpty()) return Pair(null, emptyList())

                  // Сортировка по площади (самый крупный шрифт)
                  val sortedByArea = validCandidates.sortedByDescending { it.area }
                  val mainNum = sortedByArea.first()

                  var finalPrice = mainNum.value

                  // Поиск копеек, если цена целая
                  if (finalPrice % 1 == 0.0) {
                      val kopecks = allNumbers.firstOrNull { other ->
                          other != mainNum &&
                          other.value < 100.0 && 
                          other.area < mainNum.area && 
                          other.rect.left >= mainNum.rect.right && 
                          abs(other.rect.centerY() - mainNum.rect.centerY()) < mainNum.rect.height()
                      }

                      if (kopecks != null) {
                          val kVal = kopecks.value
                          val toAdd = if (kVal < 10.0) kVal / 10.0 else kVal / 100.0
                          finalPrice += toAdd
                      }
                  }

                  val alts = sortedByArea.map { it.value }
                      .filter { it != mainNum.value && it != finalPrice }
                      .distinct()

                  return Pair(finalPrice, alts)
              }

              private fun processImageFromUri(uri: Uri) {
                  try {
                      val image = InputImage.fromFilePath(this, uri)
                      recognizer.process(image).addOnSuccessListener { visionText ->
                          val (bestPrice, list) = analyzeCroppedImage(visionText)
                          if (bestPrice == null) {
                              Toast.makeText(this, "Подходящая цена (от 15 до 15000) не найдена", Toast.LENGTH_SHORT).show()
                          } else {
                              val items = (listOf(bestPrice) + list).map { String.format("%.2f ₽", if (roundPrices) it.toInt().toDouble() else it) }.toTypedArray()
                              AlertDialog.Builder(this)
                                  .setTitle("Выбери цену:")
                                  .setItems(items) { _, which ->
                                      val sel = (listOf(bestPrice) + list)[which]
                                      val p = if (roundPrices) sel.toInt().toDouble() else sel
                                      addPriceToCart("Товар", p)
                                  }
                                  .setNegativeButton("Отмена", null)
                                  .show()
                          }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Ошибка чтения фото", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun vibrate() {
                  if (!vibeEnabled) return
                  val v = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                  v?.vibrate(VibrationEffect.createOneShot(vibeMs, VibrationEffect.DEFAULT_AMPLITUDE))
              }

              private fun addPriceToCart(name: String, price: Double) {
                  cartItems.add(0, CartItem(name, price, 1))
                  saveCart()
                  refreshCartUI()
              }

              private fun saveSettings() {
                  val prefs = getSharedPreferences("scanner_prefs", Context.MODE_PRIVATE)
                  prefs.edit()
                      .putString("theme", currentTheme)
                      .putBoolean("round", roundPrices)
                      .putBoolean("vibe_en", vibeEnabled)
                      .putLong("vibe_ms", vibeMs)
                      .apply()
              }

              private fun loadSettings() {
                  val prefs = getSharedPreferences("scanner_prefs", Context.MODE_PRIVATE)
                  currentTheme = prefs.getString("theme", "Dark") ?: "Dark"
                  roundPrices = prefs.getBoolean("round", false)
                  vibeEnabled = prefs.getBoolean("vibe_en", true)
                  vibeMs = prefs.getLong("vibe_ms", 45L)
              }

              private fun saveCart() {
                  val prefs = getSharedPreferences("scanner_prefs", Context.MODE_PRIVATE)
                  val serialized = cartItems.joinToString(";") { "${Uri.encode(it.name)}:${it.price}:${it.count}" }
                  prefs.edit().putString("cart_data", serialized).apply()
              }

              private fun loadSavedCart() {
                  val prefs = getSharedPreferences("scanner_prefs", Context.MODE_PRIVATE)
                  val serialized = prefs.getString("cart_data", "") ?: ""
                  if (serialized.isNotEmpty()) {
                      serialized.split(";").forEach { token ->
                          val parts = token.split(":")
                          if (parts.size >= 3) {
                              val name = Uri.decode(parts[0])
                              val p = parts[1].toDoubleOrNull()
                              val c = parts[2].toIntOrNull()
                              if (p != null && c != null) cartItems.add(CartItem(name, p, c))
                          }
                      }
                  }
              }

              private fun refreshCartUI() {
                  itemsContainer.removeAllViews()
                  var total = 0.0

                  cartItems.forEachIndexed { index, item ->
                      total += item.price * item.count

                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(16, 12, 16, 12)
                          gravity = Gravity.CENTER_VERTICAL
                      }

                      val tvItem = TextView(this).apply {
                          text = String.format("%s\n%.2f ₽  × %d  =  %.2f ₽", item.name, item.price, item.count, item.price * item.count)
                          setTextColor(if (currentTheme == "Light") Color.parseColor("#222222") else Color.WHITE)
                          textSize = 17f
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }

                      val btnMinus = Button(this).apply {
                          text = "−"
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                          background = makeRoundedButtonDrawable(Color.parseColor("#555555"), 16f)
                          setTextColor(Color.WHITE)
                          layoutParams = LinearLayout.LayoutParams(110, 110).apply { marginEnd = 10 }
                          setOnClickListener {
                              item.count--
                              if (item.count <= 0) cartItems.removeAt(index)
                              saveCart()
                              refreshCartUI()
                          }
                      }

                      val btnPlus = Button(this).apply {
                          text = "+"
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                          background = makeRoundedButtonDrawable(Color.parseColor("#2E7D32"), 16f)
                          setTextColor(Color.WHITE)
                          layoutParams = LinearLayout.LayoutParams(110, 110)
                          setOnClickListener {
                              item.count++
                              saveCart()
                              refreshCartUI()
                          }
                      }

                      row.addView(tvItem)
                      row.addView(btnMinus)
                      row.addView(btnPlus)
                      itemsContainer.addView(row)
                  }

                  tvTotalSum.text = String.format("Итого: %.2f ₽", total)
              }

              private fun showSettingsDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 30, 40, 10)
                  }

                  val themeLabel = TextView(this).apply { text = "Цветовая тема:"; textSize = 16f; setTextColor(Color.GRAY) }
                  val themeSpinner = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("Тёмная", "Светлая", "AMOLED (чёрная)"))
                      setSelection(when(currentTheme) { "Light" -> 1; "Amoled" -> 2; else -> 0 })
                  }

                  val roundCheck = CheckBox(this).apply {
                      text = "Округлять копейки до рублей"
                      isChecked = roundPrices
                      textSize = 17f
                  }

                  val vibeCheck = CheckBox(this).apply {
                      text = "Вибрация при добавлении"
                      isChecked = vibeEnabled
                      textSize = 17f
                  }

                  val vibeMsInput = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(vibeMs.toString())
                      hint = "Длительность (мс)"
                  }

                  layout.addView(themeLabel)
                  layout.addView(themeSpinner)
                  layout.addView(roundCheck)
                  layout.addView(vibeCheck)
                  layout.addView(TextView(this).apply { text = "Длительность вибрации (мс):"; textSize = 15f; setPadding(0, 10, 0, 0); setTextColor(Color.GRAY) })
                  layout.addView(vibeMsInput)

                  AlertDialog.Builder(this)
                      .setTitle("Настройки")
                      .setView(layout)
                      .setPositiveButton("Сохранить") { _, _ ->
                          currentTheme = when(themeSpinner.selectedItemPosition) { 1 -> "Light"; 2 -> "Amoled"; else -> "Dark" }
                          roundPrices = roundCheck.isChecked
                          vibeEnabled = vibeCheck.isChecked
                          vibeMs = vibeMsInput.text.toString().toLongOrNull() ?: 45L
                          saveSettings()
                          applyThemeColors()
                          refreshCartUI()
                          Toast.makeText(this, "Настройки сохранены", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              private fun showManualInputDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 20, 40, 10)
                  }
                  val nameInput = EditText(this).apply { hint = "Название товара (опционально)" }
                  val priceInput = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      hint = "Цена (например: 159.90)"
                  }
                  layout.addView(nameInput)
                  layout.addView(priceInput)

                  AlertDialog.Builder(this)
                      .setTitle("Ввод вручную")
                      .setView(layout)
                      .setPositiveButton("Добавить") { _, _ ->
                          val name = nameInput.text.toString().trim().ifEmpty { "Товар" }
                          val p = priceInput.text.toString().replace(",", ".").toDoubleOrNull()
                          if (p != null && p > 0) {
                              val finalP = if (roundPrices) p.toInt().toDouble() else p
                              addPriceToCart(name, finalP)
                          }
                      }
                      .setNegativeButton("Отмена", null)
                      .show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cameraExecutor.shutdown()
              }
          }
          EOF

      - name: Setup Gradle and Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          arguments: assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceScanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
